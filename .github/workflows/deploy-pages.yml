name: Deploy Devitt Family Show Team to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Keep non-site files out of the public deploy. These are useful in the
      # repo (submission kits, tests, DB schema, dev scripts) but must not be
      # served at showteam.app — the submission kit in particular contains the
      # demo-account password. Runs on the ephemeral checkout only.
      - name: Prune non-site files from the Pages artifact
        run: rm -rf submission tests scripts supabase README.md package.json package-lock.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
